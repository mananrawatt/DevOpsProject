    password => "sVjVz6J=E0Ad4=6MCFut"
    index => "app-logs-%{+YYYY.MM.dd}"  # Ensure the syntax is correct for index naming
    ssl => true
    ssl_certificate_verification => false
  }
  stdout { codec => rubydebug }
}
